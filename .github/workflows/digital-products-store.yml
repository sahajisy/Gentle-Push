name: validate-digital-products-store
on:
  push:
    paths: ["digital-products-store/**"]
  pull_request:
    paths: ["digital-products-store/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/validate.mjs
        working-directory: digital-products-store
